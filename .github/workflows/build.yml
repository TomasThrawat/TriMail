name: Build TriMail APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: trimail-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK requirements
        run: |
          sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"

      - name: Build and test
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v7
        with:
          name: trimail-debug
          path: app/build/outputs/apk/debug/*.apk
